name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Restore with NuGet audit
        shell: pwsh
        run: dotnet restore LMUG29Leds.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Build
        shell: pwsh
        run: dotnet build LMUG29Leds.csproj -c Release --no-restore
