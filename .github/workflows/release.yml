name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v0.1.0"
          }

          $version = $tag.TrimStart("v")
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Setup .NET
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Initialize CodeQL
        if: steps.existing.outputs.exists != 'true'
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: csharp

      - name: Restore with NuGet audit
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: dotnet restore LMUG29Leds.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Build with analyzers
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: dotnet build LMUG29Leds.csproj -c Release --no-restore

      - name: Analyze with CodeQL
        if: steps.existing.outputs.exists != 'true'
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52

      - name: Publish self-contained Windows executable
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet publish LMUG29Leds.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -o artifacts/win-x64

      - name: Create SHA-256 checksum
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $file = "artifacts/win-x64/LMUG29Leds.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LMUG29Leds.exe" | Set-Content "artifacts/win-x64/LMUG29Leds.exe.sha256" -Encoding ascii
          Get-Content "artifacts/win-x64/LMUG29Leds.exe.sha256"

      - name: Attest release provenance
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: artifacts/win-x64/LMUG29Leds.exe

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            "artifacts/win-x64/LMUG29Leds.exe" `
            "artifacts/win-x64/LMUG29Leds.exe.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "LMUG29Leds ${{ steps.version.outputs.tag }}" `
            --notes "First public release of LMUG29Leds. Restores Logitech G29 RPM LEDs in Le Mans Ultimate, including while using lmuFFB in Exclusive mode. Includes the native desktop UI, live RPM/throttle status, pit-limiter scanner, shift warning, automatic reconnect, SHA-256 checksum, and GitHub build provenance."
