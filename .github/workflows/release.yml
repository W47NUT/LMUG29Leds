name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"

      - name: Restore with NuGet audit
        shell: pwsh
        run: dotnet restore LMUG29Leds.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Build
        shell: pwsh
        run: dotnet build LMUG29Leds.csproj -c Release --no-restore

      - name: Publish self-contained Windows executable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish LMUG29Leds.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:Version=$version `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -o artifacts/win-x64

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $file = "artifacts/win-x64/LMUG29Leds.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LMUG29Leds.exe" | Set-Content "artifacts/win-x64/LMUG29Leds.exe.sha256" -Encoding ascii
          Get-Content "artifacts/win-x64/LMUG29Leds.exe.sha256"

      - name: Attest release provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: artifacts/win-x64/LMUG29Leds.exe

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts/win-x64/LMUG29Leds.exe" `
            "artifacts/win-x64/LMUG29Leds.exe.sha256" `
            --title "LMUG29Leds ${{ github.ref_name }}" `
            --generate-notes
